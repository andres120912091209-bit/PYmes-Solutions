<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Engranaje azul detrás -->
  <g fill="#0A3D62" opacity="0.25">
    <circle cx="260" cy="200" r="110"/>
  </g>

  <!-- Edificios -->
  <rect x="300" y="140" width="80" height="180" fill="#0A3D62"/>
  <rect x="230" y="170" width="60" height="150" fill="#145A86"/>

  <!-- Tienda -->
  <rect x="120" y="220" width="100" height="100" fill="#ffffff" stroke="#0A3D62" stroke-width="4"/>
  <rect x="120" y="200" width="100" height="30" fill="#E67E22"/>
  <rect x="120" y="200" width="20" height="30" fill="#F1C40F"/>
  <rect x="140" y="200" width="20" height="30" fill="#E67E22"/>
