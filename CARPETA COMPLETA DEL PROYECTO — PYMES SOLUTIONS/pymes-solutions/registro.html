<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Pymes Solutions</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="header">
  <div class="header-content">
    <img src="assets/img/logo.svg" alt="Logo Pymes Solutions" class="logo-img">
    <h1 class="logo-text">Pymes <span>Solutions</span></h1>
  </div>
</header>

<main class="main">
  <section class="card">
    <h2>Registro de usuario</h2>

    <form>
      <article class="form-group">
        <label for="nombres">Nombres</label>
        <input type="text" id="nombres" required>
      </article>

      <article class="form-group">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" required>
      </article>

      <article class="form-group">
        <label for="cedula">Cédula</label>
        <input type="number" id="cedula" required>
      </article>

      <article class="form-group">
        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha" required>
      </article>

      <button class="btn">Guardar</button>

      <p class="texto-secundario">
        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
      </p>
    </form>
  </section>
</main>

<footer class="footer">
  <p>© 2026 Pymes Solutions</p>
</footer>

</body>
</html>
