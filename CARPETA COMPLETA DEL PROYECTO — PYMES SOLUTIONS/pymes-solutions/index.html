<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PymesSolutions - Login</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="header">
  <div class="header-content">
    <img src="assets/img/logo.svg" alt="Logo Pymes Solutions" class="logo-img">
    <h1 class="logo-text">Pymes <span>Solutions</span></h1>
  </div>
</header>

<main class="main">
  <section class="card">
    <h2>Iniciar sesión</h2>

    <form>
      <article class="form-group">
        <label for="usuario">Correo o usuario</label>
        <input type="text" id="usuario" required>
      </article>

      <article class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </article>

      <button class="btn">Ingresar</button>

      <p class="texto-secundario">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>
    </form>
  </section>
</main>

<footer class="footer">
  <p>© 2026 Pymes Solutions</p>
</footer>

</body>
</html>
